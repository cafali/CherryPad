<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>StickyBoard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="scripts/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand">
      <img id="dashboardCherryPadLogo" src="icon/cherrypad.png" alt="" role="button" tabindex="0" aria-label="Return to CherryPad">
      <span><span class="brand-name">CherryPad</span> <span class="brand-light">StickyBoard</span></span>
    </a>

    <div class="toolbar" aria-label="Board tools">
      <button class="tool-button primary" id="addNoteButton" type="button">
        <i class="fa-solid fa-note-sticky" aria-hidden="true"></i> New note
      </button>
      <button class="tool-button next-button" id="nextNoteButton" type="button"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i> Next Note</button>
      <button class="tool-button reset-button" id="resetViewButton" type="button"><i class="fa-solid fa-crosshairs" aria-hidden="true"></i> Center View</button>
      <div class="draw-tool">
        <button class="tool-button draw-button" id="drawButton" type="button" aria-pressed="false"><i class="fa-solid fa-pen" aria-hidden="true"></i> Draw</button>
        <button class="tool-button draw-menu-toggle" id="drawMenuToggle" type="button" aria-label="Choose drawing color" aria-controls="drawColorMenu" aria-expanded="false"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
        <div class="draw-color-menu" id="drawColorMenu" role="group" aria-label="Drawing colors" hidden></div>
      </div>
      <div class="toolbar-dropdown">
        <button class="tool-button export-button dropdown-main" id="backupMenuToggle" type="button" aria-haspopup="true" aria-controls="backupMenu" aria-expanded="false"><i class="fa-solid fa-box-archive" aria-hidden="true"></i> Backup</button>
        <button class="tool-button export-button dropdown-toggle" type="button" aria-label="Choose backup action" aria-haspopup="true" aria-controls="backupMenu" aria-expanded="false"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
        <div class="toolbar-dropdown-menu" id="backupMenu" role="group" aria-label="Backup options" hidden>
          <button type="button" data-backup-action="export"><i class="fa-solid fa-download" aria-hidden="true"></i><span>Export Board</span></button>
          <button type="button" data-backup-action="import"><i class="fa-solid fa-upload" aria-hidden="true"></i><span>Import Board</span></button>
        </div>
      </div>
      <div class="toolbar-dropdown">
        <button class="tool-button clear-board-button dropdown-main" id="clearMenuToggle" type="button" aria-haspopup="true" aria-controls="clearMenu" aria-expanded="false"><i class="fa-solid fa-eraser" aria-hidden="true"></i> Clear</button>
        <button class="tool-button clear-board-button dropdown-toggle" type="button" aria-label="Choose what to clear" aria-haspopup="true" aria-controls="clearMenu" aria-expanded="false"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
        <div class="toolbar-dropdown-menu" id="clearMenu" role="group" aria-label="Clear options" hidden>
          <button type="button" data-clear-type="notes"><i class="fa-solid fa-eraser" aria-hidden="true"></i><span>Notes</span></button>
          <button type="button" data-clear-type="drawings"><i class="fa-solid fa-eraser" aria-hidden="true"></i><span>Drawing</span></button>
          <button type="button" data-clear-type="all"><i class="fa-solid fa-eraser" aria-hidden="true"></i><span>All</span></button>
        </div>
      </div>
      <input id="importInput" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="workspace">
    <div class="board-viewport" id="boardViewport" aria-label="Sticky note board. Drag the empty board to move around.">
      <div class="board-world" id="boardWorld"></div>
    </div>
    <aside class="draw-thickness-control" id="drawThicknessControl" aria-label="Drawing settings" hidden>
      <button class="draw-thickness-icon" id="drawColorIndicator" type="button" aria-label="Choose drawing color"></button>
      <label class="draw-thickness-label" for="drawThicknessSlider">Line thickness</label>
      <input id="drawThicknessSlider" type="range" min="1" max="15" step="1" value="6" aria-label="Drawing line thickness">
      <output class="draw-thickness-value" id="drawThicknessValue" for="drawThicknessSlider">6px</output>
    </aside>
    <button class="return-button" id="returnToCherryPadButton" type="button">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Return
    </button>
    <div class="board-hint" id="boardHint">
      <span><strong id="noteCount">0 notes</strong><span class="hint-separator">·</span><span id="saveStatus" aria-live="polite">All changes saved</span></span>
      <span class="board-telemetry" aria-live="polite">
        <span id="boardCoordinates">Coordinates: 0, 0</span>
        <span class="hint-separator">·</span>
        <span id="lastEdited">Last edited: --:--:--</span>
      </span>
      <span class="hint-instructions">Drag the board to move around <span>·</span> Scroll to zoom <span>·</span> Draw lines and select them to remove</span>
    </div>
  </main>
</body>
</html>
