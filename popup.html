<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>CherryPad Popup</title>
</head>
<body>
  <div class="popup-container">
    <div class="button-container">
      <button id="saveButton"><i class="fas fa-save"></i><b> Save</b></button>
      <button id="saveTxtButton"><i class="fas fa-file-download"></i><b> Download</b></button>
    </div>
    <textarea id="noteInput" placeholder="Welcome to CherryPad! Write your note here..."></textarea>
    <textarea id="noteInput2" placeholder="Write your second note here..."></textarea>
    <p id="noteStats" aria-live="polite">0 lines · 0 characters · 0 words</p>
    <div class="button-container">
      <button id="clearButton"><i class="fas fa-eraser"></i><b> Clear Note Field</b></button>
      <button id="noteFieldViewButton" type="button" aria-label="Switch note field"><i class="fa-solid fa-table-columns" aria-hidden="true"></i></button>
    </div>
    <footer>
      <p>CherryPad Makes Note-Taking Easy</p>
      <img class="cherry-icon" src="icon/cherrypad.png" alt="Cherry Icon">
    </footer>
  </div>
  <div id="popupSelectionMenu" class="popup-selection-menu" role="toolbar" aria-label="Selected text actions" hidden>
    <button type="button" class="popup-selection-action" data-selection-action="copy" aria-label="Copy selected text" title=""><i class="fas fa-copy" aria-hidden="true"></i></button>
    <span class="popup-selection-separator" aria-hidden="true">|</span>
    <button type="button" class="popup-selection-action" data-selection-action="clear" aria-label="" title=""><i class="fas fa-eraser" aria-hidden="true"></i></button>
    <span class="popup-selection-separator" aria-hidden="true">|</span>
    <button type="button" class="popup-selection-action" data-selection-action="download" aria-label="Download selected text" title=""><i class="fas fa-arrow-down" aria-hidden="true"></i></button>
    <span class="popup-selection-separator" aria-hidden="true">|</span>
    <button type="button" class="popup-selection-action" data-selection-action="search" aria-label="Search selected text on the web" title=""><i class="fas fa-search" aria-hidden="true"></i></button>
  </div>
  <nav class="popup-navigation" aria-label="Open CherryPad views">
    <a id="Fullscreen" href="cherrypad.html" target="_blank" aria-label="Fullscreen">
      <i class="fa-solid fa-expand fullscreen-icon" aria-hidden="true"></i>
    </a>
    <a id="Dashboard" href="dashboard.html" target="_blank" aria-label="Dashboard">
      <span class="popup-navigation-label" aria-hidden="true">StickyBoard</span>
      <i class="fa-solid fa-note-sticky dashboard-icon" aria-hidden="true"></i>
    </a>
  </nav>
  <script src="scripts/popup.js"></script>
</body>
</html>
