<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>CherryPad</title>
</head>
<body>
  <div class="popup-container">
    <header class="panel-header">
      <a id="Fullscreen" class="header-fullscreen-button" href="cherrypad.html" target="_blank" aria-label="Open fullscreen editor">
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
      </a>
      <img class="cherry-icon" src="icon/cherrypad.png" alt="">
      <h1>CherryPad</h1>
      <button id="noteFieldViewButton" class="header-icon-button header-field-button" type="button" aria-label="Switch note field">
        <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
      </button>
    </header>
    <div class="toolbar" role="toolbar" aria-label="Note actions">
      <button id="saveButton" class="toolbar-button save-button" type="button" aria-label="Save notes">
        <i class="fas fa-save" aria-hidden="true"></i>
        <span>Save</span>
      </button>
      <button id="saveTxtButton" class="toolbar-button download-button" type="button" aria-label="Download current field">
        <i class="fas fa-file-download" aria-hidden="true"></i>
        <span>Download</span>
      </button>
      <a id="stickyButton" class="toolbar-button toolbar-link expanded-action sticky-button" href="dashboard.html" target="_blank" aria-label="Open StickyBoard">
        <i class="fa-solid fa-note-sticky" aria-hidden="true"></i>
        <span>Sticky</span>
      </a>
      <button id="clearFieldButton" class="toolbar-button expanded-action clear-button" type="button" aria-label="Clear current field">
        <i class="fas fa-eraser" aria-hidden="true"></i>
        <span>Clear</span>
      </button>
    </div>
    <div class="editor">
      <div class="line-numbers" aria-hidden="true"><div class="line-number-list"></div></div>
      <textarea id="noteInput" aria-label="Note field 1" placeholder="Welcome to CherryPad! Write your note here..."></textarea>
      <textarea id="noteInput2" aria-label="Note field 2" placeholder="Write your second note here..."></textarea>
      <i class="fa-solid fa-eye-slash privacy-overlay" aria-hidden="true"></i>
    </div>
    <footer class="panel-footer">
      <p id="noteStats" aria-live="polite">0 lines · 0 words · Field 1</p>
      <div class="footer-actions" aria-label="Note controls">
        <button id="privacyButton" class="footer-icon" type="button" aria-label="Toggle privacy mode" aria-pressed="false">
          <i class="fa-solid fa-eye" aria-hidden="true"></i>
        </button>
        <a id="dashboardButton" class="footer-icon footer-link" href="dashboard.html" target="_blank" aria-label="Open StickyBoard" title="Open StickyBoard">
          <i class="fa-solid fa-note-sticky" aria-hidden="true"></i>
        </a>
        <button id="clearActiveFieldButton" class="footer-icon" type="button" aria-label="Clear active note field" title="Clear active note field">
          <i class="fa-solid fa-eraser" aria-hidden="true"></i>
        </button>
        <a id="About" class="footer-icon footer-link" href="about.html" target="_blank" aria-label="Open About CherryPad">
          <i class="fa fa-info-circle" aria-hidden="true"></i>
        </a>
      </div>
    </footer>
  </div>
  <div id="popupSelectionMenu" class="popup-selection-menu" role="toolbar" aria-label="Selected text actions" hidden>
    <button type="button" class="popup-selection-action" data-selection-action="copy" aria-label="Copy selected text" title="Copy selected text"><i class="fas fa-copy" aria-hidden="true"></i></button>
    <span class="popup-selection-separator" aria-hidden="true">|</span>
    <button type="button" class="popup-selection-action" data-selection-action="clear" aria-label="" title=""><i class="fas fa-eraser" aria-hidden="true"></i></button>
    <span class="popup-selection-separator" aria-hidden="true">|</span>
    <button type="button" class="popup-selection-action" data-selection-action="download" aria-label="Download selected text" title=""><i class="fas fa-arrow-down" aria-hidden="true"></i></button>
    <span class="popup-selection-separator" aria-hidden="true">|</span>
    <button type="button" class="popup-selection-action" data-selection-action="search" aria-label="Search selected text on the web" title=""><i class="fas fa-search" aria-hidden="true"></i><span aria-hidden="true">Web Search</span></button>
  </div>
  <script src="scripts/popup.js"></script>
</body>
</html>
